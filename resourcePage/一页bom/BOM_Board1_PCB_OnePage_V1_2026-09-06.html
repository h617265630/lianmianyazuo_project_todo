<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOM清单 - Board1 PCB OnePage V1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f7fa;
            color: #333;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        header {
            background: linear-gradient(135deg, #1a73e8, #0d47a1);
            color: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 12px rgba(26, 115, 232, 0.3);
        }
        header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }
        header p {
            opacity: 0.9;
            font-size: 14px;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        .stat-item {
            background: rgba(255,255,255,0.15);
            padding: 10px 20px;
            border-radius: 8px;
        }
        .stat-item .label {
            font-size: 12px;
            opacity: 0.8;
        }
        .stat-item .value {
            font-size: 24px;
            font-weight: bold;
        }
        .controls {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .search-box {
            flex: 1;
            min-width: 250px;
        }
        .search-box input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        .search-box input:focus {
            outline: none;
            border-color: #1a73e8;
        }
        .filter-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .filter-group label {
            font-size: 14px;
            color: #666;
        }
        .filter-group select {
            padding: 10px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            background: white;
            cursor: pointer;
        }
        .table-wrapper {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        #bomTable tbody tr { cursor: pointer; transition: background-color .15s ease; }
        #bomTable tbody tr:hover { background: #f7fbff; }
        #bomTable tbody tr.row-marked { background: #eaf4ff; }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            background: #f8f9fa;
            padding: 14px 12px;
            text-align: left;
            font-weight: 600;
            font-size: 13px;
            color: #555;
            border-bottom: 2px solid #e0e0e0;
            cursor: pointer;
            user-select: none;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        th:hover {
            background: #e8f0fe;
        }
        th .sort-icon {
            margin-left: 5px;
            opacity: 0.4;
        }
        th.sorted .sort-icon {
            opacity: 1;
            color: #1a73e8;
        }
        td {
            padding: 12px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 13px;
        }
        tr:hover {
            background: #f8f9ff;
        }
        tr:last-child td {
            border-bottom: none;
        }
        .qty {
            font-weight: bold;
            color: #1a73e8;
        }
        .designators {
            font-family: "SF Mono", "Consolas", monospace;
            font-size: 12px;
            color: #555;
        }
        .nc-tag {
            background: #ffebee;
            color: #c62828;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 500;
        }
        .manufacturer {
            font-size: 12px;
            color: #666;
        }
        .supplier-link {
            color: #1a73e8;
            text-decoration: none;
        }
        .supplier-link:hover {
            text-decoration: underline;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }
        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
            }
            .filter-group {
                width: 100%;
            }
            .filter-group select {
                flex: 1;
            }
            th, td {
                padding: 10px 8px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1📋 BOM清单</h1>
            <p>Board1 PCB OnePage V1 &nbsp;|&nbsp; 2026-09-06</p>
            <div class="stats">
                <div class="stat-item">
                    <div class="label">物料种类</div>
                    <div class="value" id="itemCount">0</div>
                </div>
                <div class="stat-item">
                    <div class="label">总数量</div>
                    <div class="value" id="totalQty">0</div>
                </div>
                <div class="stat-item">
                    <div class="label">有库存</div>
                    <div class="value" id="inStock">0</div>
                </div>
            </div>
        </header>

        <div class="controls">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 搜索器件型号、封装、描述...">
            </div>
            <div class="filter-group">
                <label>类型筛选:</label>
                <select id="typeFilter">
                    <option value="">全部</option>
                    <option value="C">电容 (C)</option>
                    <option value="R">电阻 (R)</option>
                    <option value="L">电感 (L)</option>
                    <option value="D">二极管 (D)</option>
                    <option value="U">IC芯片 (U)</option>
                    <option value="K">按键 (K)</option>
                    <option value="X">晶振 (X)</option>
                    <option value="J">连接器 (J)</option>
                    <option value="FPC">FPC</option>
                    <option value="USB">USB</option>
                    <option value="TP">测试点</option>
                    <option value="ANT">天线</option>
                    <option value="LED">LED</option>
                </select>
            </div>
            <div class="filter-group">
                <label>制造商:</label>
                <select id="mfgFilter">
                    <option value="">全部</option>
                </select>
            </div>
        </div>

        <div class="table-wrapper">
            <table id="bomTable">
                <thead>
                    <tr>
                        <th data-col="0">No. <span class="sort-icon">⇅</span></th>
                        <th data-col="1">数量 <span class="sort-icon">⇅</span></th>
                        <th data-col="2">描述/型号 <span class="sort-icon">⇅</span></th>
                        <th data-col="3">位号 <span class="sort-icon">⇅</span></th>
                        <th data-col="4">封装 <span class="sort-icon">⇅</span></th>
                        <th data-col="5">值 <span class="sort-icon">⇅</span></th>
                        <th data-col="6">厂商型号 <span class="sort-icon">⇅</span></th>
                        <th data-col="7">制造商 <span class="sort-icon">⇅</span></th>
                        <th data-col="8">供应商料号 <span class="sort-icon">⇅</span></th>
                        <th data-col="9">供应商 <span class="sort-icon">⇅</span></th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

            ["46","6","TS2306A 200gf 002","U6,U7,U9,U10,U13,U14","SW-SMD_L3.0-W2.0-LS3.5","","TS2306A 200gf 002","SHOU HAN(首韩)","C5363482","LCSC"],
            ["47","1","MT9700-N","U8","SOT-23-5_L2.9-W1.6-P0.95-LS2.9-BL","","MT9700-N","西安航天民芯","C42441843","LCSC"],
            ["48","1","EA8103AT5R","U11","SOT-23-5_L2.9-W1.6-P0.95-LS2.8-BL","","EA8103AT5R","everanalog(申风)","C53312128","LCSC"],
            ["49","1","LM66200DRLR","U12","SOT-583-8_L2.1-W1.2-P0.50-LS1.6-BL","","LM66200DRLR","TI(德州仪器)","C3235556","LCSC"],
            ["50","1","TYPE-C 16P CB0.8 073","USB1","USB-C-SMD_TYPE-C-16P-CB0.8-073","","TYPE-C 16P CB0.8 073","SHOU HAN(首韩)","C2906289","LCSC"],
            ["51","1","40MHz","X1","CRYSTAL-SMD_4P-L2.0-W1.6-BL-2","40MHz","T201640MFBDE2X","YJX(雅晶鑫)","C20885029","LCSC"],
            ["52","1","32.768kHz","X2","FC-12M_L2.0-W1.2","32.768kHz","X1A0000610006","EPSON(爱普生)","C99009","LCSC"]
        ];

        let sortCol = 0;
        let sortDir = 'asc';
        const MARKS_KEY = 'onepage-bom.marked-rows';
        const markedRows = new Set(JSON.parse(localStorage.getItem(MARKS_KEY) || '[]'));

        function toggleMarked(rowId, element) {
            if (markedRows.has(rowId)) { markedRows.delete(rowId); element.classList.remove('row-marked'); }
            else { markedRows.add(rowId); element.classList.add('row-marked'); }
            localStorage.setItem(MARKS_KEY, JSON.stringify([...markedRows]));
        }
        let filteredData = [...bomData];

        const headers = document.querySelectorAll('th');
        const tableBody = document.getElementById('tableBody');
        const searchInput = document.getElementById('searchInput');
        const typeFilter = document.getElementById('typeFilter');
        const mfgFilter = document.getElementById('mfgFilter');

        // Populate manufacturer filter
        const manufacturers = [...new Set(bomData.map(r => r[7]).filter(m => m))].sort();
        manufacturers.forEach(m => {
            const opt = document.createElement('option');
            opt.value = m;
            opt.textContent = m;
            mfgFilter.appendChild(opt);
        });

        function getType(designator) {
            if (!designator) return '';
            const first = designator.charAt(0);
            const map = { 'C':'C', 'R':'R', 'L':'L', 'D':'D', 'U':'U', 'K':'K', 'X':'X', 'J':'J', 'F':'FPC', 'T':'TP', 'A':'ANT', 'B':'LED' };
            return map[first] || first;
        }

        function renderTable() {
            const search = searchInput.value.toLowerCase();
            const typeVal = typeFilter.value;
            const mfgVal = mfgFilter.value;

            filteredData = bomData.filter(row => {
                const matchSearch = !search || row.some(cell => String(cell).toLowerCase().includes(search));
                const type = getType(row[3]);
                const matchType = !typeVal || type === typeVal;
                const matchMfg = !mfgVal || row[7] === mfgVal;
                return matchSearch && matchType && matchMfg;
            });

            // Sort
            filteredData.sort((a, b) => {
                const av = a[sortCol] || '';
                const bv = b[sortCol] || '';
                const cmp = av.toString().localeCompare(bv.toString(), 'en', { numeric: true });
                return sortDir === 'asc' ? cmp : -cmp;
            });

            // Stats
            document.getElementById('itemCount').textContent = filteredData.length;
            document.getElementById('totalQty').textContent = filteredData.reduce((s, r) => s + parseInt(r[1] || 0), 0);
            document.getElementById('inStock').textContent = filteredData.filter(r => r[8]).length;

            if (filteredData.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="10" class="empty-state">没有找到匹配的物料</td></tr>';
                return;
            }

            tableBody.innerHTML = filteredData.map(row => {
                const isNC = row[2] === 'NC';
                const mfgPart = row[6] || '-';
                const supplierPart = row[8] || '-';
                const supplierLink = row[8] ? `<a href="https://www.lcsc.com/search?q=${row[8]}" target="_blank" class="supplier-link">${row[8]}</a>` : '-';

                const marked = markedRows.has(row[0]);
                return `<tr tabindex="0" class="${marked ? 'row-marked' : ''}" onclick="toggleMarked('${row[0]}', this)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleMarked('${row[0]}', this)}" aria-label="点击标记物料行">
                    <td>${row[0]}</td>
                    <td class="qty">${row[1]}</td>
                    <td>${isNC ? '<span class="nc-tag">NC</span>' : row[2]}</td>
                    <td class="designators">${row[3]}</td>
                    <td>${row[4] || '-'}</td>
                    <td>${row[5] || '-'}</td>
                    <td>${mfgPart}</td>
                    <td class="manufacturer">${row[7] || '-'}</td>
                    <td>${supplierLink}</td>
                    <td>${row[9] || '-'}</td>
                </tr>`;
            }).join('');
        }

        // Event listeners
        searchInput.addEventListener('input', renderTable);
        typeFilter.addEventListener('change', renderTable);
        mfgFilter.addEventListener('change', renderTable);

        headers.forEach(th => {
            th.addEventListener('click', () => {
                const col = parseInt(th.dataset.col);
                if (sortCol === col) {
                    sortDir = sortDir === 'asc' ? 'desc' : 'asc';
                } else {
                    sortCol = col;
                    sortDir = 'asc';
                }
                headers.forEach(h => h.classList.remove('sorted'));
                th.classList.add('sorted');
                renderTable();
            });
        });

        // Initial render
        renderTable();
    </script>
</body>
</html>

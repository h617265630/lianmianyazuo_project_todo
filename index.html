<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>连绵雅座 · 工作台</title>
    <meta name="description" content="一个安静的本地工作台，把项目、待办、资料与研究收进一处。" />
    <meta name="theme-color" content="#f2f5f8" />
    <meta property="og:title" content="连绵雅座 · 工作台" />
    <meta property="og:description" content="一个安静的本地工作台，把项目、待办、资料与研究收进一处。" />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      ;(function () {
        try {
          var t = localStorage.getItem('lianmian.theme')
          if (t !== 'light' && t !== 'dark') t = 'light'
          document.documentElement.setAttribute('data-theme', t)
          var m = document.querySelector('meta[name="theme-color"]')
          if (m) m.setAttribute('content', t === 'dark' ? '#19222d' : '#f2f5f8')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
